<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

.container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
}

.container img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.hotspot {
  position: absolute;

  left: 68.5%;
  top: 60%;
  width: 150px;
  height: 150px;

  cursor: pointer;

  /* invisible normally */
  background: rgba(0, 0, 0, 0);

  z-index: 10;
}

/* DEBUG: show red box when hovering */
.hotspot:hover {
  background: rgba(255, 0, 0, 0);
}
</style>
</head>

<body>

<div class="container">

  <img src="image.png">

  <div class="hotspot"></div>

</div>

<audio id="audio" preload="auto">
  <source src="audio.mp3" type="audio/mpeg">
</audio>

<script>
document.querySelector(".hotspot").addEventListener("click", function () {
  const audio = document.getElementById("audio");
  audio.currentTime = 0;
  audio.play();
});
</script>

</body>
</html>
